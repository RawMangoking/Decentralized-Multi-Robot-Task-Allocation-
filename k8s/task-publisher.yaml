apiVersion: v1
kind: Pod
metadata:
  name: task-publisher
  labels:
    app: task-publisher
spec:
  containers:
  - name: publisher
    image: swarm-agent:latest
    imagePullPolicy: Never
    env:
    - name: RMW_IMPLEMENTATION
      value: rmw_zenoh_cpp
    - name: ZENOH_CONFIG_OVERRIDE
      value: 'mode="client";connect/endpoints=["tcp/zenoh-router:7447"]'
    args: ["ros2", "run", "swarm_agent", "task_publisher"]
