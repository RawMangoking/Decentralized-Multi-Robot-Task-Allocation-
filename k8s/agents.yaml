apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-a
  labels: {app: swarm-agent, robot: robot-a}
spec:
  replicas: 1
  selector:
    matchLabels: {robot: robot-a}
  template:
    metadata:
      labels: {app: swarm-agent, robot: robot-a}
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: swarm_agent:dev
          imagePullPolicy: Never
          env:
            - {name: ROBOT_ID, value: "robot_a"}
            - {name: START_X, value: "0.0"}
            - {name: START_Y, value: "0.0"}
---
